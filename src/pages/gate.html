<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ration</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: min(360px, 100%);
      display: grid;
      gap: 28px;
    }
    .status { font-size: 13px; font-weight: 600; margin-bottom: 6px; }

    h1 { font-size: 34px; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
    .logo { width: 34px; height: 34px; flex: none; }
    .host { margin-top: 4px; color: var(--text-3); font-size: 13px; overflow-wrap: anywhere; }
    .facts { display: grid; gap: 2px; font-size: 15px; }
    .facts .num { font-weight: 600; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .streak { display: grid; justify-items: end; line-height: 1; flex: none; }
    .streak-num { font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
    .streak-label { font-size: 12px; color: var(--text-3); margin-top: 6px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions:has(> :only-child) { grid-template-columns: 1fr; }
    .actions button { padding: 11px 14px; font-size: 15px; }
    .foot { font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); padding-top: 12px; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="gate.js"></script>
</body>
</html>
