<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ration</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 300px; }
    main { padding: 14px 16px 12px; display: grid; gap: 14px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; }
    .top h1 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .logo { width: 28px; height: 28px; flex: none; }
    .streak { display: grid; justify-items: end; line-height: 1; }
    .streak-num { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
    .streak-label { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .today { display: grid; gap: 6px; }
    .today .line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .today .big { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
    .note { font-size: 12px; color: var(--text-3); }
    .sites { border-top: 1px solid var(--line); }
    .site { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .site .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .right { display: flex; align-items: center; gap: 10px; flex: none; color: var(--text-2); }
    .site .live { color: var(--red); font-weight: 600; }
    .site button { padding: 2px 8px; font-size: 12px; }
    .foot { display: flex; gap: 16px; font-size: 13px; }
    .foot button { padding: 0; border: 0; color: var(--text-2); }
    .foot button:hover { color: var(--text); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
